<!DOCTYPE html>
<html>
    <head>
        <title>Sticky Nav and Overlay</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <nav class="sticky-nav">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
            </ul>
        </nav>
        <main class="content">
            <h2>Card Overlay Example</h2>   
            <div class="card">
                <img src="BST Logo.jpeg" alt="Placeholder" class="card-img">
                <div class="overlay">
                    <p>This is the overlay content!</p>
                </div>
            </div>
            <div class="scroll-space">
                <p>Scroll down this page to see the navigation bar stick to the top.</p>
            </div>
        </main>
    </body>
</html>
